            </header>
            <div class="trash-modal-body" id="trashModalBody"></div>
        </div>
    </div>

    <div class="modal-overlay-common" id="confirmModal">
        <div class="modal" style="max-width:360px;">
            <header class="modal-header"><h3>确认操作</h3></header>
            <div class="modal-body" id="confirmModalMsg" style="text-align:center;padding:20px;"></div>
            <div style="display:flex;justify-content:center;gap:10px;padding-bottom:20px;">
                <button type="button" class="btn btn-secondary" onclick="App.closeConfirm(false)">取消</button>
                <button type="button" class="btn btn-primary" onclick="App.closeConfirm(true)">确认</button>
            </div>
        </div>
    </div>

    <div class="context-menu" id="contextMenu" style="display:none;"></div><script>
    const CONFIG = {
        DB_NAME: 'BoostAccountingDB',
        DB_VERSION: 1,
        STORE_NAME: 'appData',
        LOG_KEY: 'logs',
        TRASH_KEY: 'trash',
        FIRST_RUN_KEY: 'firstRun',
        DARK_KEY: 'darkMode',
        THEME_KEY: 'theme',
        COMPACT_KEY: 'compactLayout',
        THEMES: ['', 'theme-purple', 'theme-green', 'theme-slate', 'theme-black', 'theme-brown'],
        SEARCH_HISTORY_KEY: 'searchHistory',
        SIDEBAR_EXPANDED_KEY: 'sidebarExpanded',
        DATA_VERSION: '3.0',
        AMOUNT_MAX: 9999999,
        PROGRESS_MAX: 999999999,
        ITEM_HEIGHT: 68,
        BUFFER_SIZE: 5,
        ORDER_TYPES: ['boost', 'rent'],
        LOG_MAX: 100,
        UNDO_MAX: 20,
        SAVE_DEBOUNCE: 800
    };

    const IDBStorage = {
        _db: null,
        _ready: false,
        _queue: [],
        _txLock: Promise.resolve(),
        async init() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(CONFIG.STORE_NAME)) {
                        db.createObjectStore(CONFIG.STORE_NAME);
                    }
                };
                request.onsuccess = (e) => {
                    this._db = e.target.result;
                    this._ready = true;
                    this._queue.forEach(fn => fn());
                    this._queue = [];
                    resolve();
                };
                request.onerror = () => {
                    this._ready = true;
                    this._queue.forEach(fn => fn());
                    this._queue = [];
                    reject(request.error);
                };
            });
        },
        _whenReady() {
            if (this._ready) return Promise.resolve();
            return new Promise(resolve => this._queue.push(resolve));
        },
        async get(key) {
            if (!State.storageAvailable) return null;
            await this._whenReady();
            return new Promise((resolve) => {
                const tx = this._db.transaction(CONFIG.STORE_NAME, 'readonly');
                const store = tx.objectStore(CONFIG.STORE_NAME);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result ?? null);
                req.onerror = () => resolve(null);
            });
        },
        async set(key, value) {
            if (!State.storageAvailable) return false;
            await this._whenReady();
            return new Promise((resolve) => {
                this._txLock = this._txLock.then(() => {
                    return new Promise((txResolve) => {
                        try {
                            const tx = this._db.transaction(CONFIG.STORE_NAME, 'readwrite');
                            const store = tx.objectStore(CONFIG.STORE_NAME);
                            store.put(value, key);
                            tx.oncomplete = () => { txResolve(); resolve(true); };
                            tx.onerror = () => { txResolve(); resolve(false); };
                        } catch (e) {
                            console.error("Critical write fail:", e);
                            txResolve();
                            resolve(false);
                        }
                    });
                });
            });
        },
        async remove(key) {
            if (!State.storageAvailable) return false;
            await this._whenReady();
            return new Promise((resolve) => {
                const tx = this._db.transaction(CONFIG.STORE_NAME, 'readwrite');
                const store = tx.objectStore(CONFIG.STORE_NAME);
                store.delete(key);
                tx.oncomplete = () => resolve(true);
                tx.onerror = () => resolve(false);
            });
        }
    };

    const Util = {
        clone(obj) {
            try { return structuredClone(obj); } catch { return JSON.parse(JSON.stringify(obj)); }
        },
        esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        },
        escAttr(str) {
            return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        },
        fmtMoney(n) {
            let a = Number(n) || 0;
            if (!isFinite(a) || a < 0) a = 0;
            if (a > CONFIG.AMOUNT_MAX) a = CONFIG.AMOUNT_MAX;
            return '¥' + (Math.round(a * 100) / 100).toFixed(2);
        },
        clampAmt(v) {
            let a = Number(v) || 0;
            if (!isFinite(a) || a < 0) a = 0;
            if (a > CONFIG.AMOUNT_MAX) a = CONFIG.AMOUNT_MAX;
            return Math.round(a * 100) / 100;
        },
        clampProg(v) {
            let a = Number(v) || 0;
            if (!isFinite(a) || a < 0) a = 0;
            if (a > CONFIG.PROGRESS_MAX) a = CONFIG.PROGRESS_MAX;
            return Math.round(a);
        },
        cents(n) { return Math.round((Number(n) || 0) * 100); },
        fromCents(c) { return c / 100; },
        genId() {
            try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch { } return 'id-' + Date.now() + '-' + Math.floor(Math.random() * 1e6);
        },
        uniqueId(set = new Set()) {
            let id;
            do { id = Util.genId(); } while (set.has(id));
            return id;
        },
        getLocalDateStr(date = new Date()) {
            const pad2 = n => n < 10 ? '0' + n : '' + n;
            return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
        },
        validate(item) {
            if (!item || typeof item !== 'object') return false;
            try {
                item.id = item.id ? String(item.id) : Util.genId();
                item.name = String(item.name || '未命名订单').trim();
                item.category = String(item.category || '未分类').trim();
                item.source = String(item.source || '').trim();
                if (!item.playDate || isNaN(Date.parse(item.playDate))) {
                    item.playDate = Util.getLocalDateStr();
                } else {
                    item.playDate = String(item.playDate);
                }
                if (!CONFIG.ORDER_TYPES.includes(item.orderType)) item.orderType = 'boost';
                if (!Array.isArray(item.subs)) item.subs = [];
                item.subs = item.subs.filter(s => {
                    if (!s || typeof s !== 'object') return false;
                    s.id = s.id ? String(s.id) : Util.genId();
                    s.isDone = !!s.isDone;
                    s.isPaid = !!s.isPaid;
                    s.amount = Util.clampAmt(s.amount);
                    s.current = Util.clampProg(s.current);
                    s.target = Util.clampProg(s.target);
                    s.note = String(s.note || '');
                    return true;
                });
                return true;
            } catch(err) {
                console.error("Critical item damage:", err);
                return false;
            }
        },
        highlight(text, kw) {
            if (!kw) return Util.esc(text);
            const regex = new RegExp(`(${kw.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
            return Util.esc(text).replace(regex, '<span class="highlight">$1</span>');
        },
        orderFingerprint(order) {
            return [order.name, order.category, order.source, order.playDate, order.orderType].join('|');
        }
    };

    const State = {
        dataset: [],
        logset: [],
        undoStack: [],
        trash: [],
        activeCategory: '',
        activeDetailId: null,
        currentSearchKeyword: '',
        storageAvailable: true,
        itemHeight: CONFIG.ITEM_HEIGHT,
        itemHeights: [],
        _dataVersion: 0,
        visibleStart: 0,
        visibleEnd: 0,
        _skipScroll: false,
        bottomBarCollapsed: false,
        lastBackupTime: Date.now(),
        selectedIds: new Set(),
        trashSelected: new Set(),
        searchHistory: [],
        filterOrderType: '',
        filterDone: '',
        filterPaid: '',
        darkMode: false,
        theme: '',
        compactLayout: false,
        importBuffer: null,
        _cachedFiltered: null,
        _cacheValid: false,
        _lastQuotaWarningTime: 0
    };

    function dataChanged() {
        State._dataVersion++;
    }

    const Storage = {
        _timer: null,
        async get(key, fallback = null) {
            if (!State.storageAvailable) return fallback;
            try {
                const value = await IDBStorage.get(key);
                return value !== null ? value : fallback;
            } catch { return fallback; }
        },
        async set(key, value) {
            if (!State.storageAvailable) return false;
            try {
                return await IDBStorage.set(key, value);
            } catch { return false; }
        },
        async saveAll(immediate = false) {
            if (!State.storageAvailable) {
                this._handleQuotaError();
                return;
            }
            if (!immediate) {
                clearTimeout(this._timer);
                this._timer = setTimeout(() => this._doSave(), CONFIG.SAVE_DEBOUNCE);
                return;
            }
            await this._doSave();
        },
        async _doSave() {
            if (!State.storageAvailable) return;
            try {
                const success = await Storage.set('dataset', State.dataset);
                if (!success) throw new Error("IDB Core Write Failed");
                await Storage.set(CONFIG.LOG_KEY, State.logset);
                await Storage.set(CONFIG.TRASH_KEY, State.trash);
                State.lastBackupTime = Date.now();
                if (!State.storageAvailable) {
                    State.storageAvailable = true;
                    document.getElementById('storageWarning').classList.remove('active');
                }
            } catch (e) {
                console.error('Core storage collapsed, running fallbacks...', e);
                try {
                    const minified = State.dataset.map(o => ({
                        i: o.id, n: o.name, c: o.category, d: o.playDate, t: o.orderType,
                        s: o.subs.map(s => [s.name, s.isDone?1:0, s.isPaid?1:0, s.amount])
                    }));
                    localStorage.setItem('EMERGENCY_BACKUP_DATA', JSON.stringify(minified));
                    Log.push('⚡ 系统：IndexedDB 写入失败，紧急备份已快照到本地闪存！');
                } catch(err) {
                    console.error('Dual storage failed!', err);
                }
                this._handleQuotaError();
            }
        },
        _handleQuotaError() {
            const now = Date.now();
            if (now - State._lastQuotaWarningTime < 30000) {
                App.exportData(true);
                return;
            }
            State._lastQuotaWarningTime = now;
            document.getElementById('storageWarning').classList.add('active');
            State.storageAvailable = false;
            App.exportData(true);
        },
        async tryRecover() {
            try {
                await IDBStorage.set('__test__', '1');
                await IDBStorage.remove('__test__');
                State.storageAvailable = true;
                document.getElementById('storageWarning').classList.remove('active');
                return true;
            } catch { return false; }
        }
    };

    const Log = {
        push(msg) {
            const t = new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
            State.logset.unshift({ time: t, msg });
            if (State.logset.length > CONFIG.LOG_MAX) State.logset = State.logset.slice(0, CONFIG.LOG_MAX);
            Storage.saveAll();
            UI.renderLogs();
        },
        clear() {
            State.logset = [];
            this.push('日志已清空');
        }
    };

    const Undo = {
        push(desc) {
            State.undoStack.push({ desc, snapshot: Util.clone(State.dataset), trashSnapshot: Util.clone(State.trash) });
            if (State.undoStack.length > CONFIG.UNDO_MAX) State.undoStack.shift();
            UI.updateUndo();
        },
        pushDelete(desc, items) {
            State.undoStack.push({ desc, type: 'delete', deletedItems: Util.clone(items) });
            if (State.undoStack.length > CONFIG.UNDO_MAX) State.undoStack.shift();
            UI.updateUndo();
        },
        async undo() {
            if (!State.undoStack.length) return;
            const item = State.undoStack.pop();
            if (item.type === 'delete') {
                const usedIds = new Set(State.dataset.map(o => o.id));
                State.dataset.forEach(o => (o.subs || []).forEach(s => usedIds.add(s.id)));
                item.deletedItems.forEach(d => {
                    const order = Util.clone(d.data);
                    order.id = Util.uniqueId(usedIds);
                    usedIds.add(order.id);
                    if (order.subs) {
                        order.subs.forEach(s => {
                            s.id = Util.uniqueId(usedIds);
                            usedIds.add(s.id);
                        });
                    }
                    State.dataset.push(order);
                    State.trash = State.trash.filter(t => t.trashId !== d.trashId);
                });
                Log.push(`撤销删除: ${item.desc}`);
            } else {
                State.dataset = item.snapshot;
                if (item.trashSnapshot) State.trash = item.trashSnapshot;
                Log.push(`撤销: ${item.desc}`);
            }
            dataChanged();
            UI.invalidateCache();
            await Storage.saveAll(true);
            UI.renderAll();
            if (State.activeDetailId) UI.syncDetail(State.activeDetailId);
        }
    };

    const OrderOps = {
        moveToTrash(items) {
            const recs = items.map(i => {
                const trashId = Util.genId();
                return { trashId, data: Util.clone(i), name: i.name };
            });
            recs.forEach(r => {
                State.trash.push({
                    id: r.data.id,
                    name: r.name,
                    data: r.data,
                    deletedAt: new Date().toISOString(),
                    trashId: r.trashId
                });
            });
            const idsSet = new Set(items.map(i => i.id));
            State.dataset = State.dataset.filter(i => !idsSet.has(i.id));
            if (State.activeDetailId && idsSet.has(State.activeDetailId)) App.closeDetail();
            dataChanged();
            return recs;
        },
        restoreFromTrash(trashItems) {
            const usedIds = new Set();
            State.dataset.forEach(o => {
                usedIds.add(o.id);
                (o.subs || []).forEach(s => usedIds.add(s.id));
            });
            trashItems.forEach(t => {
                let newId = Util.uniqueId(usedIds);
                t.data.id = newId;
                usedIds.add(newId);
                if (t.data.subs) {
                    t.data.subs.forEach(s => {
                        if (usedIds.has(s.id)) {
                            let nsid = Util.uniqueId(usedIds);
                            usedIds.add(nsid);
                            s.id = nsid;
                        } else {
                            usedIds.add(s.id);
                        }
                    });
                }
                State.dataset.push(t.data);
            });
            const trashIds = new Set(trashItems.map(t => t.trashId));
            State.trash = State.trash.filter(i => !trashIds.has(i.trashId));
            dataChanged();
        }
    };

    const UI = {
        _measureToken: null,
        _lastDataVersion: -1,
        invalidateCache() {
            State._cacheValid = false;
        },
        getFiltered() {
            if (State._cacheValid && State._cachedFiltered) return State._cachedFiltered;
            let items = State.activeCategory ? State.dataset.filter(i => (i.category || '未分类') === State.activeCategory) : State.dataset;
            if (State.filterOrderType) items = items.filter(i => i.orderType === State.filterOrderType);
            if (State.filterDone) {
                items = items.filter(i => {
                    if (!i.subs || i.subs.length === 0) return State.filterDone !== 'done';
                    const allDone = i.subs.every(s => s.isDone);
                    return State.filterDone === 'done' ? allDone : !allDone;
                });
            }
            if (State.filterPaid) {
                items = items.filter(i => {
                    if (!i.subs || i.subs.length === 0) return State.filterPaid !== 'paid';
                    const allPaid = i.subs.every(s => s.isPaid);
                    return State.filterPaid === 'paid' ? allPaid : !allPaid;
                });
            }
            if (State.currentSearchKeyword) {
                const kw = State.currentSearchKeyword.toLowerCase();
                items = items.filter(i =>
                    i.name.toLowerCase().includes(kw) ||
                    (i.category || '').toLowerCase().includes(kw) ||
                    (i.source || '').toLowerCase().includes(kw) ||
                    (i.subs || []).some(s => s.name.toLowerCase().includes(kw) || (s.note || '').toLowerCase().includes(kw))
                );
            }
            State._cachedFiltered = items;
            State._cacheValid = true;
            return items;
        },
        renderAll() {
            this.invalidateCache();
            const f = this.getFiltered();
            this.renderSidebar();
            this.renderCards(f);
            this.renderStats(f);
            this.renderLogs();
            this.updateUndo();
            this.updateBatch(f);
            this.updateDonut(f);
            this.renderFilters();
            this.updateStatActive();
        },
        renderSidebar() {
            const cats = {};
            State.dataset.forEach(i => { const c = i.category || '未分类'; cats[c] = (cats[c] || 0) + 1; });
            if (State.activeCategory && !cats[State.activeCategory]) State.activeCategory = '';
            const list = document.getElementById('sidebarList');
            list.innerHTML = '';
            const parent = document.createElement('li');
            parent.className = `sidebar-item parent ${!State.activeCategory ? 'active' : ''}`;
            parent.id = 'parentAll';
            parent.innerHTML = `<span>📁 全部订单 (${State.dataset.length})</span><span class="count">${State.dataset.length}</span>`;
            parent.onclick = () => App.toggleSidebar();
            list.appendChild(parent);
            const subDiv = document.createElement('div');
            subDiv.id = 'subCats';
            let expanded = false;
            try {
                expanded = sessionStorage.getItem(CONFIG.SIDEBAR_EXPANDED_KEY) === '1';
            } catch (e) {
                expanded = false;
            }
            subDiv.style.display = expanded ? 'block' : 'none';
            Object.keys(cats).sort().forEach(c => {
                const li = document.createElement('li');
                li.className = `sidebar-item sidebar-sub ${State.activeCategory === c ? 'active' : ''}`;
                li.dataset.category = c;
                li.innerHTML = `<span>🎮 ${Util.esc(c)}</span><span class="count">${cats[c]}</span>`;
                li.onclick = (e) => { e.stopPropagation(); App.filterCategory(c); };
                subDiv.appendChild(li);
            });
            list.appendChild(subDiv);
        },
        renderCards(filtered) {
            const container = document.getElementById('cardDeckContainer');
            const wrapper = document.getElementById('deckWrapper');
            if (!filtered.length) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>暂无订单，点击「记新单」开始</p></div>';
                State.itemHeights = [];
                this._lastDataVersion = State._dataVersion;
                return;
            }
            if (this._lastDataVersion !== State._dataVersion || State.itemHeights.length !== filtered.length) {
                State.itemHeights = [];
                this._lastDataVersion = State._dataVersion;
            }
            const wrapperHeight = wrapper.clientHeight || window.innerHeight;
            const scrollTop = wrapper.scrollTop;
            let offsets = [0];
            for (let i = 0; i < filtered.length; i++) {
                let h = State.itemHeights[i] || CONFIG.ITEM_HEIGHT;
                offsets.push(offsets[i] + h);
            }
            let startIdx = 0, lo = 0, hi = filtered.length - 1;
            while (lo <= hi) {
                let mid = (lo + hi) >> 1;
                if (offsets[mid] <= scrollTop) {
                    startIdx = mid;
                    lo = mid + 1;
                } else {
                    hi = mid - 1;
                }
            }
            startIdx = Math.max(0, startIdx - CONFIG.BUFFER_SIZE);
            const visibleCount = Math.ceil(wrapperHeight / CONFIG.ITEM_HEIGHT) + CONFIG.BUFFER_SIZE * 2;
            const endIdx = Math.min(filtered.length, startIdx + visibleCount);
            State.visibleStart = startIdx;
            State.visibleEnd = endIdx;

            let html = '';
            const topSpacerHeight = offsets[startIdx];
            html += `<div class="virtual-spacer" style="height:${topSpacerHeight}px;"></div>`;
            html += filtered.slice(startIdx, endIdx).map(item => this.buildRow(item)).join('');
            const bottomSpacerHeight = offsets[filtered.length] - offsets[endIdx];
            html += `<div class="virtual-spacer" style="height:${bottomSpacerHeight}px;"></div>`;

            const savedScrollTop = wrapper.scrollTop;
            State._skipScroll = true;
            container.innerHTML = html;
            wrapper.scrollTop = savedScrollTop;

            const currentToken = {};
            this._measureToken = currentToken;
            requestAnimationFrame(() => {
                if (this._measureToken !== currentToken) return;
                State._skipScroll = false;
                const cards = container.querySelectorAll('.swipe-item');
                let heights = [];
                cards.forEach(card => heights.push(card.getBoundingClientRect().height));
                for (let i = 0; i < cards.length; i++) {
                    const idx = startIdx + i;
                    if (idx < filtered.length) State.itemHeights[idx] = heights[i];
                }
                for (let i = 0; i < filtered.length; i++) {
                    if (State.itemHeights[i] === undefined) State.itemHeights[i] = CONFIG.ITEM_HEIGHT;
                }
                const avg = State.itemHeights.reduce((a,b) => a+b, 0) / State.itemHeights.length;
                State.itemHeight = avg || CONFIG.ITEM_HEIGHT;
            });

            App.initSwipeItems();
        },            buildRow(item) {
                const allDone = item.subs.length > 0 && item.subs.every(s => s.isDone);
                const allPaid = item.subs.length > 0 && item.subs.every(s => s.isPaid);
                let total = 0;
                item.subs.forEach(s => { total += Util.cents(s.amount); });
                const checked = State.selectedIds.has(item.id) ? 'checked' : '';
                const kw = State.currentSearchKeyword;
                const typeBadge = item.orderType === 'boost' ? 'badge-order-type boost' : 'badge-order-type rent';
                const typeLabel = item.orderType === 'boost' ? '代练' : '租号';
                return `<div class="swipe-item" data-id="${Util.escAttr(item.id)}">
                    <div class="swipe-item-inner">
                        <span class="compact-row-check" onclick="event.stopPropagation();">
                            <input type="checkbox" class="order-checkbox" data-id="${Util.escAttr(item.id)}" ${checked} onchange="App.toggleItemSelect(this)" aria-label="选择订单">
                        </span>
                        <div class="compact-row-content" data-action="openDetail" data-oid="${Util.escAttr(item.id)}">
                            <div class="compact-row-title">
                                <span class="compact-row-cat">${Util.highlight(item.category || '通用', kw)}</span>
                                ${Util.highlight(item.name, kw)}
                            </div>
                            <div class="compact-row-meta">
                                <span class="${typeBadge}">${typeLabel}</span>
                                <span class="compact-row-date">📅 ${Util.esc(item.playDate ? item.playDate.slice(5) : '')}</span>
                                <span class="compact-row-amount">${Util.fmtMoney(Util.fromCents(total))}</span>
                            </div>
                        </div>
                        <div style="display:flex; gap:4px; align-items:center;" onclick="event.stopPropagation();">
                            <button type="button" class="status-btn ${allDone ? 'done' : 'progress'}" onclick="App.quickToggleDone('${Util.escAttr(item.id)}')">${allDone ? '已完结' : '打单中'}</button>
                            <button type="button" class="status-btn ${allPaid ? 'paid' : 'unpaid'}" onclick="App.quickTogglePaid('${Util.escAttr(item.id)}')">${allPaid ? '已结清' : '待平账'}</button>
                        </div>
                    </div>
                    <div class="swipe-item-actions">
                        <button type="button" class="swipe-action-btn edit" data-action="edit" data-oid="${Util.escAttr(item.id)}">编辑</button>
                        <button type="button" class="swipe-action-btn delete" data-action="delete" data-oid="${Util.escAttr(item.id)}">删除</button>
                    </div>
                </div>`;
            },
            renderStats(filtered) {
                const total = filtered.length;
                const done = filtered.filter(i => i.subs.length && i.subs.every(s => s.isDone)).length;
                let paid = 0, boost = 0, rent = 0, totalCents = 0;
                filtered.forEach(i => {
                    i.subs.forEach(s => {
                        const c = Util.cents(s.amount);
                        totalCents += c;
                        if (s.isPaid) {
                            paid += c;
                            if (i.orderType === 'rent') rent += c;
                            else if (i.orderType === 'boost') boost += c;
                        }
                    });
                });
                document.getElementById('statTotal').textContent = total;
                document.getElementById('statDone').textContent = done;
                document.getElementById('statPaidAmount').textContent = Util.fmtMoney(Util.fromCents(paid));
                document.getElementById('statBoostPaidAmount').textContent = Util.fmtMoney(Util.fromCents(boost));
                document.getElementById('statRentPaidAmount').textContent = Util.fmtMoney(Util.fromCents(rent));
                document.getElementById('statProgress').textContent = totalCents ? Math.round(paid / totalCents * 100) + '%' : '0%';
            },
            renderLogs() {
                const list = document.getElementById('logList');
                list.innerHTML = '';
                State.logset.forEach(l => {
                    const div = document.createElement('div');
                    div.style.cssText = 'padding:6px 8px;background:#f8fafc;border-radius:6px;border-left:2px solid var(--primary);';
                    div.innerHTML = `<div style="color:var(--text-muted);font-size:10px;">${Util.esc(l.time)}</div><div style="color:var(--text-secondary);">${Util.esc(l.msg)}</div>`;
                    list.appendChild(div);
                });
            },
            updateUndo() {
                const btn = document.getElementById('bbUndo');
                if (!btn) return;
                const hasUndo = State.undoStack.length > 0;
                btn.disabled = !hasUndo;
                if (hasUndo) {
                    const last = State.undoStack[State.undoStack.length - 1];
                    btn.innerHTML = `↩ 撤销 ${last.desc ? '(' + last.desc + ')' : ''}`;
                } else {
                    btn.innerHTML = '↩ 撤销';
                }
            },
            updateBatch(filtered) {
                const bar = document.getElementById('batchBar');
                const has = State.selectedIds.size > 0;
                bar.classList.toggle('hidden', !has);
                if (has) {
                    const cb = document.getElementById('selectAllCheckbox');
                    if (cb) cb.checked = filtered.length > 0 && filtered.every(i => State.selectedIds.has(i.id));
                }
            },
            updateDonut(filtered) {
                const done = filtered.filter(i => i.subs.length && i.subs.every(s => s.isDone)).length;
                const pct = filtered.length ? Math.round(done / filtered.length * 100) : 0;
                const c = 2 * Math.PI * 20;
                const dash = (pct / 100) * c;
                document.getElementById('donutChart').innerHTML = `<svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="var(--divider)" stroke-width="5"/><circle cx="25" cy="25" r="20" fill="none" stroke="var(--primary)" stroke-width="5" stroke-dasharray="${dash} ${c - dash}" stroke-linecap="round" transform="rotate(-90 25 25)"/><text x="25" y="25" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="central">${pct}%</text></svg>`;
            },
            renderFilters() {
                const cont = document.getElementById('activeFilters');
                const tags = [];
                if (State.filterOrderType) tags.push(`类型: ${State.filterOrderType === 'boost' ? '代练' : '租号'}`);
                if (State.filterDone) tags.push(`状态: ${State.filterDone === 'done' ? '已完成' : '进行中'}`);
                if (State.filterPaid) tags.push(`收款: ${State.filterPaid === 'paid' ? '已收款' : '未收款'}`);
                if (State.currentSearchKeyword) tags.push(`搜索: ${State.currentSearchKeyword}`);
                cont.innerHTML = tags.map(t => `<span class="filter-tag" data-type="${t.split(':')[0]}">${Util.esc(t)}</span>`).join('');
                cont.querySelectorAll('.filter-tag').forEach(tag => {
                    tag.onclick = () => App.clearSingleFilter(tag.dataset.type);
                });
            },
            updateStatActive() {
                document.querySelectorAll('.stat-card').forEach(el => {
                    const f = el.dataset.filter;
                    let active = false;
                    if (f === 'all') active = !State.filterOrderType && !State.filterDone && !State.filterPaid && !State.activeCategory;
                    else if (f === 'done') active = State.filterDone === 'done';
                    else if (f === 'paid') active = State.filterPaid === 'paid';
                    else if (f === 'boost') active = State.filterOrderType === 'boost';
                    else if (f === 'rent') active = State.filterOrderType === 'rent';
                    el.classList.toggle('active-filter', active);
                });
            },
            syncDetail(id) {
                const item = State.dataset.find(i => i.id === id);
                if (!item) { document.getElementById('detailSheetOverlay').classList.remove('active'); return; }
                document.getElementById('dsTitle').textContent = item.name;
                const type = item.orderType === 'rent' ? '租号' : '代练';
                document.getElementById('dsTags').innerHTML = `<span class="badge badge-cat">${Util.esc(item.category)}</span><span class="badge badge-order-type ${item.orderType}">${type}</span><span class="badge badge-src">${Util.esc(item.source)}</span><span class="badge" style="background:var(--green-bg);color:var(--green-text);">📅 ${item.playDate}</span>`;
                const body = document.getElementById('dsBody');
                if (!item.subs || !item.subs.length) {
                    body.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px;">暂无子任务</div>';
                    return;
                }
                const grid = document.createElement('div');
                grid.className = 'sub-grid';
                item.subs.forEach(s => {
                    const pct = s.target ? Math.min(Math.round(s.current / s.target * 100), 100) : 0;
                    let barHtml = '';
                    if (s.target > 0) {
                        barHtml = `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;
                    } else {
                        barHtml = s.isDone
                            ? `<div class="progress-bar-bg"><div class="progress-bar-fill completed-no-target"></div></div>`
                            : `<div class="progress-bar-bg"><div class="progress-bar-fill empty"></div></div>`;
                    }
                    const section = document.createElement('section');
                    section.className = 'sub-card';
                    section.dataset.sid = s.id;
                    section.innerHTML = `
                        <header class="sub-card-header"><h3 class="sub-card-title">${Util.esc(s.name)}</h3><div style="display:flex;gap:8px;"><button type="button" class="status-btn ${s.isDone ? 'done' : 'progress'}" data-action="subDone" data-oid="${Util.escAttr(item.id)}" data-sid="${Util.escAttr(s.id)}">${s.isDone ? '已完成' : '进行中'}</button>
                                        <button type="button" class="status-btn ${s.isPaid ? 'paid' : 'unpaid'}" data-action="subPaid" data-oid="${Util.escAttr(item.id)}" data-sid="${Util.escAttr(s.id)}">${s.isPaid ? '已收款' : '未收款'}</button></div></header>
                        <div class="sub-card-progress-row"><div class="progress-metric-box"><span class="metric-label">进度</span><span>${s.target > 0 ? `<button class="btn" data-action="stepProg" data-oid="${Util.escAttr(item.id)}" data-sid="${Util.escAttr(s.id)}" data-step="-1">-</button><b>${s.current}</b>/${s.target}<button class="btn btn-primary" data-action="stepProg" data-oid="${Util.escAttr(item.id)}" data-sid="${Util.escAttr(s.id)}" data-step="1">+</button>` : `<button class="btn" data-action="stepProg" data-oid="${Util.escAttr(item.id)}" data-sid="${Util.escAttr(s.id)}" data-step="-1">-</button><b>${s.current}</b><button class="btn btn-primary" data-action="stepProg" data-oid="${Util.escAttr(item.id)}" data-sid="${Util.escAttr(s.id)}" data-step="1">+</button>`}</span></div>${barHtml}</div>
                        <div class="sub-card-footer"><span class="sub-card-pay-status ${s.isPaid ? 'paid' : 'unpaid'}">${s.isPaid ? '💰 已结清' : '⏳ 待结算'}</span>${s.target > 0 ? `<span>${pct}%</span>` : ''}</div>
                        ${s.note ? `<div class="sub-note">💡 ${Util.esc(s.note)}</div>` : ''}
                        <div class="sub-card-amount-row"><span class="amount-label">金额</span><div class="amount-input-wrapper"><span class="amount-prefix-symbol">¥</span><input class="sub-amount-field" value="${s.amount}" step="0.01" inputmode="decimal" data-action="updateAmt" data-oid="${Util.escAttr(item.id)}" data-sid="${Util.escAttr(s.id)}"></div></div>
                    `;
                    grid.appendChild(section);
                });
                body.innerHTML = '';
                body.appendChild(grid);
            }
        };

        const App = {
            resizeTimer: null,
            searchTimer: null,
            searchHideTimer: null,
            _amtUpdating: false,
            _safeAreaInterval: null,
            isTouchDevice: 'ontouchstart' in window || navigator.maxTouchPoints > 0,
            async init() {
                try {
                    await IDBStorage.init();
                    console.log('IndexedDB initialized');
                } catch (e) {
                    console.error('IndexedDB init failed, falling back to memory only', e);
                    State.storageAvailable = false;
                }

                State.darkMode = await Storage.get(CONFIG.DARK_KEY, false);
                State.theme = await Storage.get(CONFIG.THEME_KEY, '');
                State.compactLayout = await Storage.get(CONFIG.COMPACT_KEY, false);
                document.body.classList.toggle('dark', State.darkMode);
                if (State.theme && State.darkMode) document.body.classList.add(State.theme);
                document.body.classList.toggle('compact-layout', State.compactLayout);
                document.getElementById('darkModeBtn').innerHTML = State.darkMode ? '☀️ 亮色模式' : '🌓 暗色模式';
                document.getElementById('compactLayoutBtn').innerHTML = State.compactLayout ? '📏 舒适模式' : '📏 紧凑模式';

                State.searchHistory = await Storage.get(CONFIG.SEARCH_HISTORY_KEY, []);
                State.dataset = (await Storage.get('dataset', [])).filter(Util.validate);
                State.logset = await Storage.get(CONFIG.LOG_KEY, []);
                State.trash = await Storage.get(CONFIG.TRASH_KEY, []);

                if (!State.dataset.length && !(await Storage.get(CONFIG.FIRST_RUN_KEY))) {
                    const today = Util.getLocalDateStr();
                    const yest = Util.getLocalDateStr(new Date(Date.now() - 864e5));
                    State.dataset = [
                        { id: Util.genId(), name: '巅峰赛1800分', category: '王者荣耀', source: '安卓Q区', orderType: 'boost', playDate: today, subs: [{ id: Util.genId(), name: '打单', current: 0, target: 0, isDone: true, isPaid: true, amount: 60, note: '好评' }] },
                        { id: Util.genId(), name: '定级赛10胜', category: 'LOL', source: '艾欧尼亚', orderType: 'boost', playDate: yest, subs: [{ id: Util.genId(), name: '打单', current: 0, target: 0, isDone: true, isPaid: false, amount: 30, note: '' }] }
                    ];
                    await Storage.set(CONFIG.FIRST_RUN_KEY, '1');
                    await Storage.saveAll(true);
                    Log.push('初始化完成');
                }
                dataChanged();
                UI.renderAll();

                const wrapper = document.getElementById('deckWrapper');
                let lastY = 0;
                let scrollTicking = false;
                wrapper.addEventListener('scroll', () => {
                    const st = wrapper.scrollTop;
                    if (st > lastY + 10) {
                        document.getElementById('topbar').classList.add('hidden');
                        if (!State.bottomBarCollapsed) document.getElementById('bottomBar').classList.add('hidden');
                    } else if (st < lastY - 5 || st < 10) {
                        document.getElementById('topbar').classList.remove('hidden');
                        if (!State.bottomBarCollapsed) document.getElementById('bottomBar').classList.remove('hidden');
                    }
                    lastY = st;

                    if (!scrollTicking && !State._skipScroll) {
                        window.requestAnimationFrame(() => {
                            UI.renderCards(UI.getFiltered());
                            scrollTicking = false;
                        });
                        scrollTicking = true;
                    }
                }, { passive: true });

                if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                    window.visualViewport.addEventListener('resize', () => {
                        const vh = window.visualViewport.height;
                        document.documentElement.style.setProperty('--app-real-height', `${vh}px`);
                    });
                }

                document.getElementById('cardDeckContainer').addEventListener('click', e => {
                    const action = e.target.closest('[data-action]');
                    if (!action) return;
                    const type = action.dataset.action;
                    const oid = action.dataset.oid;
                    if (type === 'toggleDone') this.toggleAllDone(oid, e);
                    if (type === 'togglePaid') this.toggleAllPaid(oid, e);
                    if (type === 'edit') this.openEdit(oid);
                    if (type === 'delete') this.confirmDelete(oid, e);
                    if (type === 'openDetail') {
                        if (e.target.closest('button[data-action],.order-checkbox,[data-action]')) return;
                        this.openDetail(oid);
                    }
                });

                const dsBody = document.getElementById('dsBody');
                dsBody.addEventListener('click', e => {
                    const action = e.target.closest('[data-action]');
                    if (!action) return;
                    const type = action.dataset.action;
                    const oid = action.dataset.oid;
                    const sid = action.dataset.sid;
                    if (type === 'subDone') this.toggleSubDone(oid, sid, action);
                    if (type === 'subPaid') this.toggleSubPaid(oid, sid, action);
                    if (type === 'stepProg') this.stepProg(oid, sid, parseInt(action.dataset.step));
                });
                dsBody.addEventListener('change', e => {
                    const action = e.target.closest('[data-action]');
                    if (!action || this._amtUpdating) return;
                    if (action.dataset.action === 'updateAmt') {
                        this.updateAmt(action.dataset.oid, action.dataset.sid, action.value, action);
                    }
                });
                dsBody.addEventListener('blur', e => {
                    const action = e.target.closest('[data-action]');
                    if (!action || this._amtUpdating) return;
                    if (action.dataset.action === 'updateAmt') {
                        this.updateAmt(action.dataset.oid, action.dataset.sid, action.value, action);
                    }
                }, true);

                document.getElementById('debtModalBody').addEventListener('click', e => {
                    const btn = e.target.closest('[data-action="settleDebt"]');
                    if (btn) {
                        this.settleDebt(btn.dataset.oid, btn.dataset.sid);
                    }
                });

                document.getElementById('trashModalBody').addEventListener('click', e => {
                    const restore = e.target.closest('[data-action="restoreTrash"]');
                    const del = e.target.closest('[data-action="permanentDeleteTrash"]');
                    if (restore) this.restoreTrash(restore.dataset.tid);
                    if (del) this.permanentDeleteTrash(del.dataset.tid);
                });

                const histContainer = document.getElementById('searchHistory');
                histContainer.addEventListener('click', e => {
                    clearTimeout(App.searchHideTimer);
                    const removeBtn = e.target.closest('.remove');
                    if (removeBtn) {
                        const item = removeBtn.closest('.search-history-item');
                        if (item) this.removeSearchHistory(item.dataset.kw);
                        return;
                    }
                    const item = e.target.closest('.search-history-item');
                    if (!item) return;
                    document.getElementById('globalSearch').value = item.dataset.kw;
                    this.handleSearchInput();
                });

                this.initSwipeHandler();
                this.setSafeArea();

                window.addEventListener('resize', () => {
                    clearTimeout(this.resizeTimer);
                    this.resizeTimer = setTimeout(() => {
                        const d = document.getElementById('leftDrawer');
                        if (window.innerWidth > 600) d.classList.remove('active-mobile');
                        else d.classList.remove('collapsed');
                        document.getElementById('drawerBackdrop').classList.toggle('active', d.classList.contains('active-mobile') || document.getElementById('logDrawer').classList.contains('active'));
                        UI.invalidateCache();
                        UI.renderCards(UI.getFiltered());
                    }, 150);
                });

                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') {
                        if (document.getElementById('confirmModal').classList.contains('active')) this.closeConfirm(false);
                        else { this.closeModal(); this.closeDetail(); this.closeImportModal(); }
                    }
                    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'F') {
                        e.preventDefault();
                        document.getElementById('globalSearch').focus();
                    }
                    if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement === document.body) {
                        e.preventDefault();
                        this.openCreateModal();
                    }
                });

                document.addEventListener('contextmenu', e => {
                    const t = e.target.closest('.swipe-item');
                    if (!t) return;
                    e.preventDefault();
                    const menu = document.getElementById('contextMenu');
                    const id = t.dataset.id;
                    menu.innerHTML = '';
                    const actions = [
                        { label: '编辑', fn: () => this.openEdit(id) },
                        { label: '详情', fn: () => this.openDetail(id) },
                        { label: '删除', fn: () => this.confirmDelete(id, e) }
                    ];
                    actions.forEach(a => {
                        const div = document.createElement('div');
                        div.className = 'context-menu-item';
                        div.textContent = a.label;
                        div.onclick = () => { a.fn(); menu.style.display = 'none'; };
                        menu.appendChild(div);
                    });
                    menu.style.display = 'block';
                    menu.style.left = e.pageX + 'px';
                    menu.style.top = e.pageY + 'px';
                });
                document.addEventListener('click', e => {
                    if (!e.target.closest('#contextMenu')) document.getElementById('contextMenu').style.display = 'none';
                });

                window.addEventListener('beforeunload', () => {
                    if (this._safeAreaInterval) clearInterval(this._safeAreaInterval);
                });

                this.bindGlobalEvents();
            },
            bindGlobalEvents() {
                window.addEventListener('resize', () => UI.renderCards(UI.getFiltered()), { passive: true });
            },
            setSafeArea() {
                if (this._safeAreaInterval) {
                    clearInterval(this._safeAreaInterval);
                    this._safeAreaInterval = null;
                }
                const updateSafe = () => {
                    const root = document.documentElement;
                    let safeBottom = getComputedStyle(root).getPropertyValue('--safe-bottom').trim();
                    if (!safeBottom || safeBottom === '0px' || safeBottom === '') {
                        let defaultSafe = 20;
                        if (window.visualViewport && window.innerHeight) {
                            defaultSafe = Math.max(20, window.innerHeight - window.visualViewport.height);
                        }
                        root.style.setProperty('--safe-bottom', defaultSafe + 'px');
                    }
                };
                updateSafe();
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', updateSafe);
                } else {
                    this._safeAreaInterval = setInterval(updateSafe, 2000);
                }
            },
            async tryRecoverStorage() {
                if (await Storage.tryRecover()) {
                    await Storage.saveAll(true);
                    Log.push('存储空间恢复，已重试保存');
                    alert('存储空间已恢复，数据可以继续保存了');
                } else {
                    alert('存储空间仍然不足，请清理浏览器数据或导出备份');
                }
            },
            toggleLeftDrawer() {
                const d = document.getElementById('leftDrawer');
                if (window.innerWidth <= 600) {
                    d.classList.toggle('active-mobile');
                    document.getElementById('drawerBackdrop').classList.toggle('active', d.classList.contains('active-mobile'));
                } else {
                    d.classList.toggle('collapsed');
                }
            },
            closeAllDrawers() {
                document.getElementById('leftDrawer').classList.remove('active-mobile');
                document.getElementById('logDrawer').classList.remove('active');
                document.getElementById('drawerBackdrop').classList.remove('active');
            },
            toggleRightDrawer(show) {
                document.getElementById('logDrawer').classList.toggle('active', show);
                document.getElementById('drawerBackdrop').classList.toggle('active', show);
            },
            toggleBottomBar() {
                State.bottomBarCollapsed = !State.bottomBarCollapsed;
                const b = document.getElementById('bottomBar'), f = document.getElementById('bottomBarToggleFloat');
                if (State.bottomBarCollapsed) { 
                    b.classList.add('hidden'); 
                    f.classList.add('raised');
                    f.classList.add('visible');
                } else { 
                    b.classList.remove('hidden'); 
                    f.classList.remove('raised');
                    f.classList.remove('visible');
                }
            },
            async toggleDarkMode() {
                State.darkMode = !State.darkMode;
                document.body.classList.toggle('dark', State.darkMode);
                await Storage.set(CONFIG.DARK_KEY, State.darkMode);
                document.getElementById('darkModeBtn').innerHTML = State.darkMode ? '☀️ 亮色模式' : '🌓 暗色模式';
                if (!State.darkMode) this.setTheme('');
            },
            async setTheme(themeName) {
                State.theme = themeName || '';
                CONFIG.THEMES.forEach(t => { if(t) document.body.classList.remove(t); });
                if (State.theme && State.darkMode) document.body.classList.add(State.theme);
                await Storage.set(CONFIG.THEME_KEY, State.theme);
            },
            async cycleTheme() {
                if (!State.darkMode) { await this.toggleDarkMode(); }
                const idx = CONFIG.THEMES.indexOf(State.theme);
                const next = CONFIG.THEMES[(idx + 1) % CONFIG.THEMES.length];
                await this.setTheme(next);
                Log.push(`切换主题: ${next || '默认'}`);
            },
            async toggleCompactLayout() {
                State.compactLayout = !State.compactLayout;
                document.body.classList.toggle('compact-layout', State.compactLayout);
                await Storage.set(CONFIG.COMPACT_KEY, State.compactLayout);
                document.getElementById('compactLayoutBtn').innerHTML = State.compactLayout ? '📏 舒适模式' : '📏 紧凑模式';
                State.itemHeight = CONFIG.ITEM_HEIGHT;
                dataChanged();
                UI.renderAll();
            },
            openDetail(id) {
                State.activeDetailId = id;
                UI.syncDetail(id);
                document.getElementById('detailSheetOverlay').classList.add('active');
            },
            closeDetail() {
                document.querySelectorAll('.sub-amount-field').forEach(inp => inp.blur());
                document.getElementById('detailSheetOverlay').classList.remove('active');
                State.activeDetailId = null;
            },
            filterCategory(cat) {
                State.activeCategory = cat;
                State.selectedIds.clear();
                State.visibleStart = 0; State.visibleEnd = 0;
                UI.renderAll();
                if (window.innerWidth <= 600) this.closeAllDrawers();
            },
            toggleSidebar() {
                const sub = document.getElementById('subCats');
                const exp = sub.style.display === 'block';
                sub.style.display = exp ? 'none' : 'block';
                try {
                    sessionStorage.setItem(CONFIG.SIDEBAR_EXPANDED_KEY, exp ? '0' : '1');
                } catch (e) {}
                this.filterCategory('');
            },
            addNewGame() {
                const n = prompt('请输入游戏名称：');
                if (n && n.trim()) { this.openCreateModal(); document.getElementById('fCategory').value = n.trim(); }
            },
            applyFilters() {
                State.filterOrderType = document.getElementById('filterOrderType').value;
                State.filterDone = document.getElementById('filterDone').value;
                State.filterPaid = document.getElementById('filterPaid').value;
                State.selectedIds.clear();
                State.visibleStart = 0; State.visibleEnd = 0;
                UI.renderAll();
            },
            quickFilter(type, done, paid) {
                document.getElementById('filterOrderType').value = type;
                document.getElementById('filterDone').value = done;
                document.getElementById('filterPaid').value = paid;
                this.applyFilters();
            },
            clearSingleFilter(type) {
                if (type === '类型') { State.filterOrderType = ''; document.getElementById('filterOrderType').value = ''; }
                if (type === '状态') { State.filterDone = ''; document.getElementById('filterDone').value = ''; }
                if (type === '收款') { State.filterPaid = ''; document.getElementById('filterPaid').value = ''; }
                if (type === '搜索') this.clearSearch();
                this.applyFilters();
            },
            handleSearchInput() {
                clearTimeout(this.searchTimer);
                this.searchTimer = setTimeout(() => {
                    const raw = document.getElementById('globalSearch').value.trim();
                    State.currentSearchKeyword = raw.toLowerCase();
                    document.getElementById('searchClear').classList.toggle('visible', !!raw);
                    if (raw) {
                        const kw = raw.toLowerCase();
                        if (!State.searchHistory.some(h => h.toLowerCase() === kw)) {
                            State.searchHistory.unshift(raw);
                            if (State.searchHistory.length > 10) State.searchHistory.pop();
                            Storage.set(CONFIG.SEARCH_HISTORY_KEY, State.searchHistory);
                        }
                    }
                    State.selectedIds.clear();
                    State.visibleStart = 0; State.visibleEnd = 0;
                    UI.renderAll();
                }, 200);
            },
            clearSearch() {
                document.getElementById('globalSearch').value = '';
                State.currentSearchKeyword = '';
                document.getElementById('searchClear').classList.remove('visible');
                State.selectedIds.clear();
                State.visibleStart = 0; State.visibleEnd = 0;
                UI.renderAll();
            },
            showSearchHistory() {
                clearTimeout(this.searchHideTimer);
                const cont = document.getElementById('searchHistory');
                if (!State.searchHistory.length) { cont.classList.remove('active'); return; }
                cont.innerHTML = State.searchHistory.map(k => `
                    <div class="search-history-item" data-kw="${Util.escAttr(k)}">

            async saveItem(e) {
                e.preventDefault();
                const name = document.getElementById('fName').value.trim();
                const cat = document.getElementById('fCategory').value.trim();
                const src = document.getElementById('fSource').value.trim();
                const type = document.getElementById('fOrderType').value;
                const date = document.getElementById('fPlayDate').value;
                const editId = document.getElementById('editId').value;
                const subs = [];
                document.querySelectorAll('#subsContainer .sub-form-card').forEach(r => {
                    const n = r.querySelector('.sf-name').value.trim();
                    if (!n) return;
                    let cur = Util.clampProg(r.querySelector('.sf-cur').value);
                    let tgt = Util.clampProg(r.querySelector('.sf-tgt').value);
                    let subId = r.querySelector('.sf-id').value;
                    let done = r.querySelector('.sf-done').value === 'true';
                    let paid = r.querySelector('.sf-paid').value === 'true';
                    if (tgt > 0 && cur > tgt) cur = tgt;
                    if (done && tgt > 0) cur = tgt;
                    subs.push({
                        id: subId, name: n, current: cur, target: tgt,
                        isDone: done, isPaid: paid,
                        note: r.querySelector('.sf-note').value.trim(),
                        amount: Util.clampAmt(r.querySelector('.sf-amount').value)
                    });
                });
                if (!subs.length) { alert('请至少添加一个子任务'); return; }
                if (editId) {
                    const idx = State.dataset.findIndex(i => i.id === editId);
                    if (idx >= 0) {
                        Undo.push('编辑订单');
                        State.dataset[idx] = {
                            id: editId, name, category: cat, source: src,
                            orderType: type, playDate: date, subs,
                            createdAt: State.dataset[idx].createdAt || new Date().toISOString()
                        };
                        Log.push(`更新订单: ${name}`);
                    } else {
                        alert('保存失败：订单已被删除');
                        this.closeModal();
                        return;
                    }
                } else {
                    Undo.push('新建订单');
                    State.dataset.push({
                        id: Util.genId(), name, category: cat, source: src,
                        orderType: type, playDate: date, subs,
                        createdAt: new Date().toISOString()
                    });
                    Log.push(`新建订单: ${name}`);
                }
                dataChanged();
                await Storage.saveAll(true);
                this.closeModal();
                UI.renderAll();
                if (State.activeDetailId) UI.syncDetail(State.activeDetailId);
            },
            closeModal() { document.getElementById('itemModal').classList.remove('active'); },
            handleImportFile(e) {
                const fileInput = e.target;
                const file = fileInput.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!data || !data.dataset || !Array.isArray(data.dataset)) {
                            alert('导入失败：文件格式不规范');
                            fileInput.value = '';
                            return;
                        }
                        State.importBuffer = data;
                        document.getElementById('importModal').classList.add('active');
                    } catch { alert('文件解析失败'); }
                    fileInput.value = '';
                };
                reader.onerror = () => {
                    alert('文件读取失败');
                    fileInput.value = '';
                };
                reader.readAsText(file);
            },
            closeImportModal() {
                document.getElementById('importModal').classList.remove('active');
                State.importBuffer = null;
            },
            confirmImport(mode) {
                const data = State.importBuffer;
                if (!data) return;
                this.closeImportModal();
                const cleaned = data.dataset.filter(Util.validate);
                if (mode === 'overwrite') {
                    this.showConfirm('确定完全覆盖现有数据？此操作不可撤销！', async () => {
                        Undo.push('导入数据（覆盖）');
                        State.dataset = cleaned;
                        State.logset = Array.isArray(data.logset) ? data.logset : [];
                        State.trash = Array.isArray(data.trash) ? data.trash.filter(t => t && typeof t === 'object' && t.data && Util.validate(t.data)) : [];
                        State.activeCategory = '';
                        State.selectedIds.clear();
                        State.visibleStart = 0; State.visibleEnd = 0;
                        State.filterOrderType = '';
                        State.filterDone = '';
                        State.filterPaid = '';
                        State.currentSearchKeyword = '';
                        document.getElementById('filterOrderType').value = '';
                        document.getElementById('filterDone').value = '';
                        document.getElementById('filterPaid').value = '';
                        document.getElementById('globalSearch').value = '';
                        State.importBuffer = null;
                        dataChanged();
                        await Storage.saveAll(true);
                        Log.push(`导入成功（覆盖）: ${cleaned.length} 条`);
                        UI.renderAll();
                        alert(`成功导入 ${cleaned.length} 条有效订单！`);
                    });
                } else {
                    this.showConfirm('确定要合并数据吗？', async () => {
                        Undo.push('导入数据（合并）');
                        const existingFingerprints = new Set(State.dataset.map(Util.orderFingerprint));
                        let added = 0, skipped = 0;
                        cleaned.forEach(item => {
                            const fp = Util.orderFingerprint(item);
                            if (existingFingerprints.has(fp)) skipped++;
                            else {
                                existingFingerprints.add(fp);
                                State.dataset.push(item);
                                added++;
                            }
                        });
                        if (Array.isArray(data.logset) && data.logset.length) {
                            State.logset = [...data.logset, ...State.logset].slice(0, CONFIG.LOG_MAX);
                        }
                        State.importBuffer = null;
                        dataChanged();
                        await Storage.saveAll(true);
                        Log.push(`导入成功（合并）: 新增 ${added} 条, 跳过 ${skipped} 条重复`);
                        UI.renderAll();
                        alert(`合并完成：新增 ${added} 条，跳过 ${skipped} 条重复订单`);
                    });
                }
            },
            openDebtModal() {
                const body = document.getElementById('debtModalBody');
                const debts = [];
                State.dataset.forEach(o => {
                    o.subs.forEach(s => {
                        if (!s.isPaid && Util.clampAmt(s.amount) > 0) {
                            debts.push({ orderId: o.id, subId: s.id, subName: s.name, orderName: o.name, amount: Util.clampAmt(s.amount) });
                        }
                    });
                });
                if (!debts.length) {
                    body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">🎉 所有款项已结清</div>';
                } else {
                    const total = debts.reduce((s, d) => s + Util.cents(d.amount), 0);
                    const grouped = {};
                    debts.forEach(d => { if (!grouped[d.orderName]) grouped[d.orderName] = []; grouped[d.orderName].push(d); });
                    let html = `<div class="debt-summary"><span>待收款总额</span><span class="debt-total">${Util.fmtMoney(Util.fromCents(total))}</span></div>`;
                    Object.keys(grouped).forEach(on => {
                        const items = grouped[on];
                        const subTotal = items.reduce((s, d) => s + Util.cents(d.amount), 0);
                        html += `<div class="debt-order-group"><div class="debt-order-title"><span>📋 ${Util.esc(on)}</span><span>小计: ${Util.fmtMoney(Util.fromCents(subTotal))}</span></div>`;
                        items.forEach(d => {
                            html += `<div class="debt-sub-row"><span>↳ ${Util.esc(d.subName)}</span><div><span class="debt-sub-amount">${Util.fmtMoney(d.amount)}</span><button class="btn btn-primary" data-action="settleDebt" data-oid="${Util.escAttr(d.orderId)}" data-sid="${Util.escAttr(d.subId)}">结算</button></div></div>`;
                        });
                        html += '</div>';
                    });
                    body.innerHTML = html;
                }
                document.getElementById('debtModal').classList.add('active');
            },

                this.openDebtModal();

            initSwipeHandler() {
                let item = null, startX = 0, startY = 0, movedX = 0, movedY = 0, swiping = false;
                const cont = document.getElementById('cardDeckContainer');
                cont.addEventListener('touchstart', e => {
                    const t = e.target.closest('.swipe-item');

                    if (item && item !== t) this.closeSwipe(item);
                    item = t;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    movedX = 0; movedY = 0;
                    swiping = true;
                }, { passive: true });
                cont.addEventListener('touchmove', e => {
                    if (!swiping || !item) return;
                    movedX = e.touches[0].clientX - startX;
                    movedY = e.touches[0].clientY - startY;
                    if (movedX < -10 && Math.abs(movedX) > Math.abs(movedY) * 1.5) {
                        e.preventDefault();
                        const inner = item.querySelector('.swipe-item-inner');
                        inner.style.transform = `translateX(${Math.max(-120, Math.min(0, movedX))}px)`;
                    }
                }, { passive: false });
                cont.addEventListener('touchend', () => {
                    if (!swiping || !item) return;
                    const inner = item.querySelector('.swipe-item-inner');
                    if (movedX < -60 && Math.abs(movedX) > Math.abs(movedY) * 1.5) {
                        item.classList.add('open');
                        inner.style.transform = 'translateX(-120px)';
                    } else {
                        this.closeSwipe(item);
                    }
                    swiping = false;
                });
                document.addEventListener('click', e => {
                    if (item && !item.contains(e.target)) this.closeSwipe(item);
                });
            },
            initSwipeItems() {
                const openItem = document.querySelector('.swipe-item.open');
                const openId = openItem ? openItem.dataset.id : null;
                document.querySelectorAll('.swipe-item.open').forEach(i => {
                    if (!openId || i.dataset.id !== openId) this.closeSwipe(i);
                });
                if (openId) {
                    const newEl = document.querySelector(`.swipe-item[data-id="${openId}"]`);
                    if (newEl) {
                        newEl.classList.add('open');
                        newEl.querySelector('.swipe-item-inner').style.transform = 'translateX(-120px)';
                    }
                }
            },
            closeSwipe(item) {
                item.classList.remove('open');
                item.querySelector('.swipe-item-inner').style.transform = '';
            },
            async toggleSubDone(oid, sid, dot) {
                const it = State.dataset.find(i => i.id === oid);
                if (!it) return;
                const s = it.subs.find(s => s.id === sid);
                if (!s) return;
                Undo.push('切换子任务完成');
                s.isDone = !s.isDone;
                if (s.isDone) s.current = s.target;
                Log.push(`详情-完成: ${it.name} ${s.name}`);
                dataChanged();
                await Storage.saveAll();
                UI.invalidateCache();
                UI.syncDetail(oid);
                UI.renderCards(UI.getFiltered());
                UI.renderStats(UI.getFiltered());
                UI.updateDonut(UI.getFiltered());
            },
            async toggleSubPaid(oid, sid, dot) {
                const it = State.dataset.find(i => i.id === oid);
                if (!it) return;
                const s = it.subs.find(s => s.id === sid);
                if (!s) return;
                Undo.push('切换子任务收款');
                s.isPaid = !s.isPaid;
                Log.push(`详情-收款: ${it.name} ${s.name}`);
                dataChanged();
                await Storage.saveAll();
                UI.invalidateCache();
                UI.syncDetail(oid);
                UI.renderCards(UI.getFiltered());
                UI.renderStats(UI.getFiltered());
            },
            async stepProg(oid, sid, step) {
                const it = State.dataset.find(i => i.id === oid);
                if (!it) return;
                const s = it.subs.find(s => s.id === sid);
                if (!s) return;
                if (step < 0 && s.current <= 0) return;
                if (step > 0 && s.target > 0 && s.current >= s.target) return;
                Undo.push('微调进度');
                s.current = Util.clampProg(s.current + step);
                if (s.target > 0) {
                    if (s.current >= s.target) {
                        s.current = s.target;
                        s.isDone = true;
                    } else {
                        s.isDone = false;
                    }
                }
                Log.push(`进度: ${it.name} ${s.name} ${s.current}`);
                dataChanged();
                await Storage.saveAll();
                UI.invalidateCache();
                UI.syncDetail(oid);
                UI.renderCards(UI.getFiltered());
                UI.renderStats(UI.getFiltered());
                UI.updateDonut(UI.getFiltered());
            },
            async updateAmt(oid, sid, val, inp) {
                if (this._amtUpdating) return;
                this._amtUpdating = true;
                const it = State.dataset.find(i => i.id === oid);
                if (!it) { this._amtUpdating = false; return; }
                const s = it.subs.find(s => s.id === sid);
                if (!s) { this._amtUpdating = false; return; }
                const clamped = Util.clampAmt(val);
                const changed = s.amount !== clamped;
                if (changed) {
                    Undo.push('修改金额');
                    s.amount = clamped;
                    Log.push(`金额: ${it.name} ${s.name} ${Util.fmtMoney(clamped)}`);
                    dataChanged();
                    await Storage.saveAll();
                    UI.invalidateCache();
                }
                if (inp) inp.value = clamped;
                if (State.activeDetailId === oid) UI.syncDetail(oid);
                UI.renderCards(UI.getFiltered());
                UI.renderStats(UI.getFiltered());
                this._amtUpdating = false;
            },
            showConfirm(msg, cb) {
                document.getElementById('confirmModalMsg').textContent = msg;
                document.getElementById('confirmModal').classList.add('active');
                document.getElementById('confirmModal')._cb = cb;
            },
            closeConfirm(confirmed) {
                const modal = document.getElementById('confirmModal');
                modal.classList.remove('active');
                if (confirmed && typeof modal._cb === 'function') {
                    modal._cb();
                }
                modal._cb = null;
            }
        };

        App.init();
    </script>
</body>
