<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>打单记账本</title>
    <meta name="description" content="高效、轻量级的打单收益统计与记账系统">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent !important; }
        :root {
            --bg: #f8fafc;
            --primary: #10b981;
            --primary-hover: #0da271;
            --primary-light: #ecfdf5;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --divider: #f1f5f9;
            --green: #10b981; --green-bg: #ecfdf5; --green-text: #065f46;
            --red: #f43f5e; --red-bg: #fff1f2; --red-text: #9f1239;
            --amber: #f59e0b; --amber-bg: #fffbeb; --amber-text: #92400e;
            --purple: #8b5cf6; --purple-bg: #faf5ff; --purple-text: #6b21a8;
            --blue: #3b82f6; --blue-bg: #eff6ff; --blue-text: #1e40af;
            --radius: 16px; --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.02);
            --touch-target: 44px;
            --card-padding-y: 12px; --card-padding-x: 16px;
            --card-gap: 10px;
            --card-title-size: 15px;
            --card-meta-size: 11px;
            --card-badge-size: 10px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        .dark {
            --bg: #0f172a; --primary: #34d399; --primary-hover: #10b981; --primary-light: #064e3b;
            --text: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #64748b;
            --border: #334155; --divider: #1e293b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.5);
            --green: #34d399; --green-bg: #064e3b; --green-text: #a7f3d0;
            --red: #fb7185; --red-bg: #4c0519; --red-text: #fecdd3;
            --amber: #fbbf24; --amber-bg: #78350f; --amber-text: #fde68a;
            --purple: #a78bfa; --purple-bg: #4c1d95; --purple-text: #ddd6fe;
            --blue: #60a5fa; --blue-bg: #1e3a8a; --blue-text: #bfdbfe;
        }
        .dark.theme-purple { --bg: #1a1025; --divider: #2d1b3e; --border: #4a3065; --primary-light: #2d1b3e; }
        .dark.theme-green { --bg: #0f1f17; --divider: #1e3328; --border: #2d4a3e; --primary-light: #1e3328; }
        .dark.theme-slate { --bg: #1e1e2e; --divider: #2d2d3e; --border: #3d3d4e; --primary-light: #2d2d3e; }
        .dark.theme-black { --bg: #0a0a0a; --divider: #1a1a1a; --border: #2a2a2a; --primary-light: #1a1a1a; }
        .dark.theme-brown { --bg: #1f1714; --divider: #2e221c; --border: #4a3b32; --primary-light: #2e221c; }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 13px; overflow: hidden; }
        .num, .amount-suffix, .sub-amount-field, .stat-card .num, .debt-total, .debt-sub-amount, .status-pill, .count, .sf-amount {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace, system-ui;
            font-variant-numeric: tabular-nums; font-weight: 700;
        }
        input, select, textarea { font-family: inherit; }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; background: #fff; color: var(--text); transition: all 0.15s ease; }
        .dark .form-control, .dark select.form-control { background: #1e293b; color: var(--text); border-color: var(--border); }
        select.form-control { appearance: none; -webkit-appearance: none; background-image: none !important; padding-right: 12px; }
        .dark select.form-control { background-image: none !important; padding-right: 12px; }
        input:focus, select:focus, .form-control:focus { border-color: var(--primary) !important; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12) !important; outline: none !important; }
        
        .app { display: flex; flex-direction: column; height: var(--app-real-height, 100dvh); padding-top: var(--safe-top); }

        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); z-index: 100; flex-shrink: 0;
            transition: transform 0.2s ease; will-change: transform;
        }
        .topbar.hidden { transform: translateY(-100%); }
        .dark .topbar { background: rgba(15, 23, 42, 0.85); }
        .brand { font-weight: 800; font-size: 15px; color: var(--text); letter-spacing: -0.02em; margin: 0; }

        .search-container { flex: 1; max-width: 280px; position: relative; display: flex; align-items: center; }
        .search-input { flex: 1; min-width: 0; padding: 6px 12px 6px 32px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; background: #f1f5f9; border-color: transparent; width: auto; }
        .dark .search-input { background: #1e293b; color: var(--text); }
        .search-input:focus { background: #fff; }
        .dark .search-input:focus { background: #1e293b; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; color: var(--text-muted); cursor: pointer; z-index: 1; }
        .search-clear { margin-left: 4px; flex-shrink: 0; background: none; border: none; color: var(--text-muted); cursor: pointer; display: none; font-size: 14px; padding: 4px; line-height: 1; }
        .search-clear.visible { display: block; }
        .search-history { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md); z-index: 200; max-height: 150px; overflow-y: auto; display: none; }
        .dark .search-history { background: #1e293b; border-color: var(--border); }
        .search-history.active { display: block; }
        .search-history-item { padding: 8px 12px; font-size: 12px; cursor: pointer; color: var(--text-secondary); border-bottom: 1px solid var(--divider); display: flex; justify-content: space-between; }
        .search-history-item:hover { background: var(--primary-light); }
        .search-history-item .remove { color: var(--text-muted); font-weight: bold; padding: 0 4px; }

        .filter-bar { display: flex; gap: 8px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
        .filter-bar select { max-width: 120px; }
        .active-filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-height: 0; margin-top: 4px; }
        .filter-tag { background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
        .filter-tag::after { content: '✕'; font-size: 10px; margin-left: 2px; }

        .main-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        .drawer-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.15); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 990; display: none; }
        .drawer-backdrop.active { display: block; }
        .drawer-left { width: 200px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; transition: all 0.2s ease; }
        .dark .drawer-left { background: #1e293b; }
        @media(min-width: 601px) { .drawer-left.collapsed { width: 0; overflow: hidden; border-right: none; } }
        .sidebar-header { padding: 16px 16px 6px; font-weight: 700; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .sidebar-list { flex: 1; overflow-y: auto; padding: 4px 8px; list-style: none; }
        .sidebar-item {
            display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: var(--radius-sm);
            cursor: pointer; color: var(--text-secondary); font-weight: 500; font-size: 13px; margin-bottom: 2px; transition: all 0.15s ease;
        }
        .sidebar-item:hover { background: #f8fafc; color: var(--text); }
        .dark .sidebar-item:hover { background: #334155; }
        .sidebar-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
        .sidebar-item .count { font-size: 10px; background: #f1f5f9; padding: 2px 6px; border-radius: 10px; color: var(--text-muted); font-weight: 600; }
        .sidebar-item.active .count { background: #fff; color: var(--primary); }
        .dark .sidebar-item .count { background: #334155; }
        .dark .sidebar-item.active .count { background: #1e293b; }
        .sidebar-item.parent { font-weight: 700; }
        .sidebar-sub { padding-left: 20px; }
        .sidebar-add-game { padding: 8px; margin: 4px 8px; border: 1px dashed var(--border); border-radius: var(--radius-sm); cursor: pointer; text-align: center; color: var(--primary); font-weight: 600; font-size: 12px; transition: all 0.15s ease; }
        .sidebar-add-game:hover { background: var(--primary-light); border-color: var(--primary); }
        .sidebar-actions { padding: 8px; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--divider); }
        .sidebar-action-btn { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: var(--text-secondary); font-weight: 500; font-size: 12px; background: #fff; display: flex; align-items: center; gap: 8px; transition: all 0.15s ease; box-shadow: var(--shadow-sm); }
        .dark .sidebar-action-btn { background: #1e293b; }
        .sidebar-action-btn:hover { background: #f8fafc; color: var(--text); border-color: var(--text-muted); }

        .drawer-right {
            position: fixed; top: 0; right: 0; bottom: 0; width: 280px; background: #fff; border-left: 1px solid var(--border);
            display: flex; flex-direction: column; z-index: 1000; transform: translateX(100%); transition: transform 0.2s ease; box-shadow: var(--shadow-lg);
            padding-bottom: var(--safe-bottom, 0px);
        }
        .dark .drawer-right { background: #1e293b; }
        .drawer-right.active { transform: translateX(0); }

        .content-area { flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: calc(68px + var(--safe-bottom, 0px)); }

        .stats-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; flex-shrink: 0; }
        .stat-card { background: #fff; border-radius: var(--radius-sm); padding: 10px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); display: flex; flex-direction: column; transition: all 0.2s ease; cursor: pointer; position: relative; }
        .dark .stat-card { background: #1e293b; }
        .stat-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--text-muted); }
        .stat-card.active-filter { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16,185,129,0.15); }
        .stat-card .lbl { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
        .stat-card .num { font-size: 16px; font-weight: 800; color: var(--text); }
        .stat-card.accent .num { color: var(--primary); }
        .stat-card.money .num { color: var(--green); }

        .chart-row { display: flex; gap: 16px; flex-shrink: 0; align-items: center; }
        .donut-chart { position: relative; width: 50px; height: 50px; flex-shrink: 0; }
        .donut-chart svg { width: 100%; height: 100%; }
        .donut-chart text { fill: var(--text); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }

        .deck-wrapper { flex: 1; width: 100%; overflow-x: hidden; overflow-y: auto; display: block; outline: none; padding-bottom: 8px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; position: relative; }
        .deck-container { display: flex; flex-direction: column; width: 100%; gap: 8px; padding: 2px; position: relative; }
        .virtual-spacer { width: 100%; flex-shrink: 0; }

        .swipe-item {
            position: relative; overflow: hidden; background: #fff;
            border-radius: var(--radius-sm); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .dark .swipe-item { background: #1e293b; }
        .swipe-item-inner {
            position: relative; z-index: 2; background: inherit; display: flex; align-items: center;
            padding: var(--card-padding-y) var(--card-padding-x); gap: var(--card-gap); transition: transform 0.2s ease; will-change: transform;
        }
        .swipe-item.open .swipe-item-inner { transform: translateX(-120px); }
        .swipe-item-actions { position: absolute; right: 0; top: 0; bottom: 0; display: flex; align-items: stretch; z-index: 1; }
        .swipe-action-btn {
            width: 60px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; color: #fff; cursor: pointer; transition: background 0.15s;
        }
        .swipe-action-btn.edit { background: var(--primary); }
        .swipe-action-btn.delete { background: var(--red); }
        .swipe-action-btn:active { filter: brightness(0.9); }

        .compact-row-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .compact-row-title { font-size: var(--card-title-size); font-weight: 700; color: var(--text); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .compact-row-meta { display: flex; align-items: center; gap: 8px; font-size: var(--card-meta-size); color: var(--text-secondary); }
        .compact-row-date, .compact-row-amount { white-space: nowrap; }
        .compact-row-amount { font-weight: 700; color: var(--green); }
        .compact-row-cat {
            font-size: var(--card-badge-size); font-weight: 700; color: var(--primary);
            background: var(--primary-light); padding: 2px 8px; border-radius: 10px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px;
        }
        .compact-row-check { flex-shrink: 0; }

        body.compact-layout {
            --card-padding-y: 6px; --card-padding-x: 12px;
            --card-gap: 6px;
            --card-title-size: 13px;
            --card-meta-size: 10px;
            --card-badge-size: 9px;
        }

        .status-btn {
            display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
            cursor: pointer; border: none; user-select: none; transition: all 0.15s ease; line-height: 1.4; font-family: inherit;
        }
        .status-btn:hover { filter: brightness(0.92); }
        .status-btn:active { transform: scale(0.95); }
        .status-btn.done { background: var(--green-bg); color: var(--green-text); }
        .status-btn.progress { background: #fff7ed; color: #c2410c; }
        .status-btn.paid { background: var(--green-bg); color: var(--green-text); }
        .status-btn.unpaid { background: var(--red-bg); color: var(--red-text); }
        .sf-status-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .sf-status-row .status-btn { flex: 1; justify-content: center; min-height: 28px; font-size: 11px; padding: 4px 10px; border-radius: var(--radius-sm); }

        .badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; line-height: 1.2; }
        .badge-cat { background: var(--primary-light); color: var(--primary); }
        .badge-src { background: #f1f5f9; color: var(--text-secondary); border: 1px solid var(--border); }
        .dark .badge-src { background: #334155; }
        .badge-order-type.boost { background: var(--blue-bg); color: var(--blue-text); }
        .badge-order-type.rent { background: var(--purple-bg); color: var(--purple-text); }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 4px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease; box-shadow: var(--shadow-sm); user-select: none; min-height: 28px; }
        .btn:active { transform: scale(0.98); }
        .btn-icon-only { background: none; border: none; font-size: 18px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
        .btn-icon-only:hover { background: #f1f5f9; color: var(--text); }
        .dark .btn-icon-only:hover { background: #334155; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; color: var(--text-secondary); border-color: var(--border); }
        .dark .btn-secondary { background: #1e293b; }
        .btn-secondary:hover { background: #f8fafc; border-color: var(--text-muted); }

        .detail-sheet-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; justify-content: center; align-items: flex-end; z-index: 1500; }
        .detail-sheet-overlay.active { display: flex; }
        .detail-sheet { background: #fff; width: 100%; max-width: 500px; border-radius: var(--radius) var(--radius) 0 0; padding: 20px 20px calc(12px + var(--safe-bottom, 0px)); max-height: 85vh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
        .dark .detail-sheet { background: #1e293b; }
        .detail-sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; border-bottom: 1px solid var(--divider); padding-bottom: 12px; flex-shrink: 0; }
        .detail-sheet-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 10px; }

        .sub-grid { display: flex; flex-direction: column; gap: 12px; }
        .sub-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm); transition: all 0.2s ease; }
        .dark .sub-card { background: #1e293b; }
        .sub-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
        .sub-card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .sub-card-title { font-weight: 700; color: var(--text); font-size: 13px; flex: 1; word-break: break-all; margin: 0; }
        .sub-card-badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; font-weight: 700; white-space: nowrap; }
        .sub-card-badge.done { background: var(--green-bg); color: var(--green-text); }
        .sub-card-badge.running { background: #fff7ed; color: #c2410c; }
        .sub-card-progress-row { display: flex; flex-direction: column; gap: 6px; background: #f8fafc; padding: 10px 12px; border-radius: 8px; border: 1px solid #f1f5f9; }
        .dark .sub-card-progress-row { background: #0f172a; border-color: #334155; }
        .progress-metric-box { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .metric-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); }
        .num-highlight { color: var(--primary); font-weight: 800; font-size: 13px; }
        .progress-bar-bg { width: 100%; background: #e2e8f0; height: 8px; border-radius: 4px; overflow: hidden; position: relative; margin-top: 2px; }
        .progress-bar-fill { background: linear-gradient(90deg, var(--primary-hover), var(--primary)); height: 100%; width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 4px; box-shadow: 0 1px 2px rgba(16, 185, 129, 0.15); }
        .progress-bar-fill.completed-no-target { background: linear-gradient(90deg, #34d399, var(--green)); width: 100%; box-shadow: 0 1px 2px rgba(16, 185, 129, 0.15); }
        .progress-bar-fill.empty { background: #cbd5e1; width: 100%; box-shadow: none; }
        .sub-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .sub-card-pay-status { font-size: 11px; font-weight: 700; white-space: nowrap; padding: 3px 8px; border-radius: 6px; }
        .sub-card-pay-status.paid { background: var(--green-bg); color: var(--green-text); }
        .sub-card-pay-status.unpaid { background: var(--amber-bg); color: var(--amber-text); }
        .sub-card-amount-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; margin-top: 4px; border-top: 1px dashed var(--border); width: 100%; }
        .sub-card-amount-row .amount-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
        .amount-input-wrapper { display: inline-flex; align-items: center; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 2px 10px; transition: all 0.15s ease; }
        .dark .amount-input-wrapper { background: #0f172a; }
        .amount-input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.12); background: #fff; }
        .amount-prefix-symbol { font-size: 13px; font-weight: 700; color: var(--green); margin-right: 4px; user-select: none; }
        .sub-card-amount-row input.sub-amount-field { width: 95px; border: none !important; background: transparent !important; padding: 4px 0; font-size: 14px; font-weight: 700; text-align: right; color: var(--text); outline: none !important; box-shadow: none !important; }
        .sub-note { font-size: 11px; background: #f8fafc; padding: 6px 10px; border-radius: 4px; color: var(--text-secondary); border-left: 3px solid var(--primary); width: 100%; margin-top: 4px; word-break: break-all; }
        .dark .sub-note { background: #0f172a; }

        .sub-form-card { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 12px; position: relative; transition: all 0.2s ease; }
        .dark .sub-form-card { background: #0f172a; }
        .sub-form-card:focus-within { border-color: var(--primary); background: #fff; box-shadow: var(--shadow-sm); }

    <div class="storage-warning" id="storageWarning">
